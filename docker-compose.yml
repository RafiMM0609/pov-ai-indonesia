services:
  pov-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pov-ai-indonesia
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - KNOWLEDGE_DIR=/app/data/knowledge
      - DB_PATH=/app/data/povai.db
      - STATIC_DIR=/app/web/static
      - TEMPLATE_DIR=/app/web/templates/*
      - CORS_ALLOW_ORIGIN=*
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - POV_AI_MODEL=${POV_AI_MODEL:-openrouter/owl-alpha}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-6}
      - CRON_AI_REFRESH=${CRON_AI_REFRESH:-0 3 * * *}
      - CRON_GOV_DATA=${CRON_GOV_DATA:-0 2 * * 0}
      - TZ=Asia/Jakarta
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
